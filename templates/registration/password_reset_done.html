{% extends "base.html" %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:#12261e;">
  <div class="card p-4 shadow text-center" style="width: 380px; border-radius: 14px;">
    <i class="bi bi-envelope-check text-success" style="font-size:32px;"></i>
    <h5 class="fw-bold mt-2">Check your email</h5>
    <p class="text-muted small">If an account exists with that email, we've sent a link to reset your password.</p>
    <a href="{% url 'login' %}" class="small">Back to sign in</a>
  </div>
</div>
{% endblock %}
