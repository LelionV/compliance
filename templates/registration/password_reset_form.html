{% extends "base.html" %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:#12261e;">
  <div class="card p-4 shadow" style="width: 380px; border-radius: 14px;">
    <h5 class="fw-bold mb-2">Reset your password</h5>
    <p class="text-muted small">Enter your account email and we'll send you a link to reset it.</p>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <input type="email" name="email" class="form-control" placeholder="you@company.com" required autofocus>
      </div>
      <button type="submit" class="btn w-100" style="background:#1f7a4d;color:#fff;">Send reset link</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="small text-muted">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
