{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-3">Change Password</h4>
<div class="panel-card" style="max-width: 480px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label small fw-semibold">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    <button type="submit" class="btn text-white" style="background:#1f7a4d;">Update password</button>
  </form>
</div>
{% endblock %}
