{% extends "base.html" %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background:#12261e;">
  <div class="card p-4 shadow text-center" style="width: 380px; border-radius: 14px;">
    <i class="bi bi-check-circle text-success" style="font-size:32px;"></i>
    <h5 class="fw-bold mt-2">Password updated</h5>
    <p class="text-muted small">You can now sign in with your new password.</p>
    <a href="{% url 'login' %}" class="btn w-100" style="background:#1f7a4d;color:#fff;">Sign in</a>
  </div>
</div>
{% endblock %}
