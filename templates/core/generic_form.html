{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-3">{{ page_title }}</h4>
<div class="panel-card" style="max-width: 640px;">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
        {% if field.help_text %}<div class="text-muted small mt-1">{{ field.help_text }}</div>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn text-white" style="background:#1f7a4d;">Save</button>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
